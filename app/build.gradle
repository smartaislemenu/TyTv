plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tytv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tytv.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.1"
    }

    buildFeatures {
        // SettingsActivity reads BuildConfig.VERSION_NAME for About;
        // the generate task did not run without this explicit opt-in.
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for unit tests: the android.jar stub throws, so
    // ScoresApi.parse tests need the standalone implementation.
    testImplementation 'org.json:json:20240303'
}
