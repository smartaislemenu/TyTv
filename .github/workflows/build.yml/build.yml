name: Build TYTV debug APK

# Standard-toolchain (Gradle/AGP) build of the TYTV Android TV app.
# Triggered by pushes to main and manually. Produces a debug APK as a
# workflow artifact and writes a small text status file (ci-status.txt)
# back to main so the build result can be read without the Actions API.
# The status commit carries [skip ci] so it does not re-trigger itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        id: build
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tytv-gradle-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish build status
        if: always()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "outcome=${{ steps.build.outcome }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            if [ -f "$APK" ]; then
              echo "apk_size=$(stat -c%s "$APK")"
              echo "apk_sha256=$(sha256sum "$APK" | cut -d' ' -f1)"
            else
              echo "apk_missing=true"
              echo "--- build.log tail ---"
              tail -60 build.log
            fi
          } > ci-status.txt
          git config user.name "tytv-ci"
          git config user.email "tytv-ci@users.noreply.github.com"
          git add ci-status.txt
          git commit -m "[skip ci] build status for ${{ github.sha }}" || echo "nothing to commit"
          git push origin HEAD:main || echo "status push failed"
